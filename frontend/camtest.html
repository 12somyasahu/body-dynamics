<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Body Dynamics — Motion Engine</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: monospace;
    overflow: hidden;
  }

  #window {
    display: grid;
    grid-template-columns: 60% 40%;
    height: 100vh;
    padding: 10px;
    gap: 10px;
  }

  #left {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #videoBox {
    position: relative;
    border: 3px solid #00ff9c;
    background: #000;
    flex-grow: 1;
  }

  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  #statsBox {
    border: 2px solid #222;
    padding: 15px;
    font-size: 16px;
    background: #111;
  }

  #right {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .tile {
    border: 2px solid #222;
    background: #111;
    padding: 20px;
  }

  .label {
    font-size: 14px;
    opacity: 0.5;
    margin-bottom: 5px;
  }

  .value {
    font-size: 26px;
    font-weight: bold;
  }

  .stable { color: #00ff9c; }
  .marginal { color: #ffaa00; }
  .unstable { color: #ff003c; }
</style>
</head>
<body>

<div id="window">
  <div id="left">
    <div id="videoBox">
      <video id="video" muted playsinline></video>
      <canvas id="canvas"></canvas>
      <canvas id="cap" style="display:none;"></canvas>
    </div>

    <div id="statsBox">
      FPS: <span id="fps">—</span><br>
      COM: <span id="com">—</span><br>
      ENGINE: <span id="wsStatus" style="color:#ff003c">OFFLINE</span>
    </div>
  </div>

  <div id="right">
    <div class="tile">
      <div class="label">PHASE</div>
      <div id="phase" class="value">—</div>
    </div>

    <div class="tile">
      <div class="label">SUPPORT</div>
      <div id="support" class="value">—</div>
    </div>

    <div class="tile">
      <div class="label">STABILITY</div>
      <div id="stability" class="value">—</div>
    </div>

    <div class="tile">
      <div class="label">MARGIN</div>
      <div id="margin" class="value">—</div>
    </div>
  </div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const cap = document.getElementById("cap");
const capCtx = cap.getContext("2d");

let lastPose = null;
let comTrail = [];

const SKELETON = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],
  [23,25],[25,27],[24,26],[26,28],
  [27,29],[29,31],[28,30],[30,32]
];

function render(points, trail) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  if(!points) return;

  ctx.strokeStyle="#00b3ff";
  ctx.lineWidth=2;

  SKELETON.forEach(([a,b]) => {
    if(points[a] && points[b]) {
      ctx.beginPath();
      ctx.moveTo(points[a].x*canvas.width, points[a].y*canvas.height);
      ctx.lineTo(points[b].x*canvas.width, points[b].y*canvas.height);
      ctx.stroke();
    }
  });

  if(trail.length > 0){
    ctx.strokeStyle="rgba(0,255,156,0.6)";
    ctx.beginPath();
    trail.forEach((p,i) => {
      const x = p.x*canvas.width;
      const y = p.y*canvas.height;
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
}

let ws;

function connect() {
  ws = new WebSocket("ws://127.0.0.1:8000/ws/live");

  ws.onopen = () => {
    document.getElementById("wsStatus").textContent = "ONLINE";
    document.getElementById("wsStatus").style.color = "#00ff9c";
  };

  ws.onclose = () => {
    document.getElementById("wsStatus").textContent = "OFFLINE";
    document.getElementById("wsStatus").style.color = "#ff003c";
    setTimeout(connect, 2000);
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if(data.type === "pose") {
      lastPose = data.keypoints.person_0;
    }

    if(data.type === "stats") {
      document.getElementById("fps").textContent = data.fps || "—";

      document.getElementById("phase").textContent =
        (data.phase || "—").toUpperCase();

      document.getElementById("support").textContent =
        (data.support || "—").toUpperCase();

      if(data.stability) {
        const state = data.stability.state;
        document.getElementById("stability").textContent =
          state.toUpperCase();
        document.getElementById("stability").className =
          "value " + state;

        document.getElementById("margin").textContent =
          data.stability.margin ?? "—";
      }

      if(data.com_trail) {
        comTrail = data.com_trail;
        const latest = comTrail[comTrail.length-1];
        if(latest){
          document.getElementById("com").textContent =
            `${latest.x}, ${latest.y}`;
        }
      }
    }
  };
}

connect();

navigator.mediaDevices.getUserMedia({video:true})
.then(async s => {
  video.srcObject = s;
  await video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  cap.width = video.videoWidth;
  cap.height = video.videoHeight;

  setInterval(() => {
    if(ws.readyState===1) {
      capCtx.drawImage(video,0,0,cap.width,cap.height);
      cap.toBlob(b => ws.send(b), "image/jpeg", 0.6);
    }
  }, 100);

  const loop = () => {
    render(lastPose, comTrail);
    requestAnimationFrame(loop);
  };

  loop();
});
</script>
</body>
</html>
