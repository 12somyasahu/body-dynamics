<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Body Dynamics — Live Engine View</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0d0d0d;
      color: #00ff9c;
      font-family: monospace;
    }

    #stage {
      position: relative;
      width: 640px;
      height: 480px;
      border: 2px solid #00ff9c;
      background: black;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }

    #stats {
      margin-top: 10px;
      padding: 10px;
      background: #111;
      border: 1px solid #00ff9c;
      white-space: pre;
      font-size: 13px;
      max-width: 640px;
    }
  </style>
</head>

<body>

<h2>Body Dynamics — Engine Debug View</h2>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="stats">Waiting for data…</div>

<script>
/* =========================
   BASIC SETUP
========================= */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statsBox = document.getElementById("stats");

/* =========================
   STATE
========================= */
let lastPose = null;
let lastStats = null;

/* =========================
   SKELETON (MediaPipe)
========================= */
const SKELETON = [
  [11, 13], [13, 15],
  [12, 14], [14, 16],
  [11, 12],
  [11, 23], [12, 24],
  [23, 24],
  [23, 25], [25, 27],
  [24, 26], [26, 28]
];

/* =========================
   HELPERS
========================= */
function isValidPoint(p) {
  return Array.isArray(p) && p.length >= 2 &&
         Number.isFinite(p[0]) && Number.isFinite(p[1]);
}

/* =========================
   DRAWING
========================= */
function drawSkeleton(points) {
  ctx.strokeStyle = "#00b3ff";
  ctx.lineWidth = 3;

  SKELETON.forEach(([a, b]) => {
    if (!isValidPoint(points[a]) || !isValidPoint(points[b])) return;

    ctx.beginPath();
    ctx.moveTo(points[a][0] * canvas.width, points[a][1] * canvas.height);
    ctx.lineTo(points[b][0] * canvas.width, points[b][1] * canvas.height);
    ctx.stroke();
  });
}

function drawPoints(points) {
  ctx.fillStyle = "#ff003c";
  points.forEach(p => {
    if (!isValidPoint(p)) return;
    ctx.beginPath();
    ctx.arc(p[0] * canvas.width, p[1] * canvas.height, 4, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawCOM(com) {
  if (!com) return;

  ctx.fillStyle = "#00ff9c";
  ctx.beginPath();
  ctx.arc(
    com.x * canvas.width,
    com.y * canvas.height,
    6,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.fillText("COM",
    com.x * canvas.width + 8,
    com.y * canvas.height - 8
  );
}

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket("ws://127.0.0.1:8000/ws/live");

ws.onmessage = (e) => {
  let msg;
  try {
    msg = JSON.parse(e.data);
  } catch {
    return;
  }

  if (msg.type === "pose" && msg.keypoints?.person_0) {
    lastPose = msg.keypoints.person_0;
  }

  if (msg.type === "stats") {
    lastStats = msg;
    statsBox.textContent = JSON.stringify(msg, null, 2);
  }
};

/* =========================
   CAMERA
========================= */
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      setInterval(sendFrame, 100); // ~10 FPS
      requestAnimationFrame(render);
    };
  });

/* =========================
   SEND FRAME
========================= */
function sendFrame() {
  if (ws.readyState !== WebSocket.OPEN) return;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    if (!blob) return;
    blob.arrayBuffer().then(buf => ws.send(buf));
  }, "image/jpeg", 0.6);
}

/* =========================
   RENDER LOOP
========================= */
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (lastPose) {
    drawSkeleton(lastPose);
    drawPoints(lastPose);
  }

  if (lastStats?.center_of_mass) {
    drawCOM(lastStats.center_of_mass);
  }

  if (lastStats?.events?.motion) {
    ctx.fillStyle = "#ffaa00";
    ctx.fillText(
      `MOTION: ${lastStats.events.motion}`,
      10,
      20
    );
  }

  if (lastStats?.lateral_bias?.direction &&
      lastStats.lateral_bias.direction !== "centered") {
    ctx.fillStyle = "#ff7b00";
    ctx.fillText(
      `LATERAL BIAS: ${lastStats.lateral_bias.direction.toUpperCase()}`,
      10,
      40
    );
  }

  requestAnimationFrame(render);
}
</script>

</body>
</html>
