<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Body Dynamics – Live Pose</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0d0d0d;
      color: #00ff9c;
      font-family: monospace;
    }

    #stage {
      position: relative;
      width: 640px;
      height: 480px;
      border: 2px solid #00ff9c;
      background: black;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }

    #stats {
      margin-top: 10px;
      padding: 10px;
      background: #111;
      border: 1px solid #00ff9c;
      white-space: pre;
      font-size: 13px;
    }
  </style>
</head>

<body>

<h2>Body Dynamics — Live Pose</h2>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="stats">Waiting for data…</div>

<script>
/* =========================
   BASIC SETUP
========================= */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statsBox = document.getElementById("stats");

/* =========================
   STATE
========================= */
let lastValidPose = null;
let lastStats = null;

/* =========================
   SKELETON DEFINITION (MediaPipe)
========================= */
const SKELETON = [
  [11, 13], [13, 15],       // left arm
  [12, 14], [14, 16],       // right arm
  [11, 12],                // shoulders
  [11, 23], [12, 24],      // torso
  [23, 24],                // hips
  [23, 25], [25, 27],      // left leg
  [24, 26], [26, 28]       // right leg
];

/* =========================
   HELPERS
========================= */
function isValidPoint(p) {
  return (
    Array.isArray(p) &&
    p.length >= 2 &&
    Number.isFinite(p[0]) &&
    Number.isFinite(p[1])
  );
}

/* =========================
   DRAW FUNCTIONS
========================= */
function drawSkeleton(points) {
  ctx.strokeStyle = "#00b3ff";
  ctx.lineWidth = 3;

  SKELETON.forEach(([a, b]) => {
    if (!isValidPoint(points[a]) || !isValidPoint(points[b])) return;

    const x1 = points[a][0] * canvas.width;
    const y1 = points[a][1] * canvas.height;
    const x2 = points[b][0] * canvas.width;
    const y2 = points[b][1] * canvas.height;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });
}

function drawPoints(points) {
  ctx.fillStyle = "#ff003c";
  points.forEach(p => {
    if (!isValidPoint(p)) return;
    ctx.beginPath();
    ctx.arc(p[0]*canvas.width, p[1]*canvas.height, 4, 0, Math.PI*2);
    ctx.fill();
  });
}

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket("ws://127.0.0.1:8000/ws/live");

ws.onopen = () => {
  console.log("[WS] Connected");
};

ws.onmessage = (e) => {
  let msg;
  try {
    msg = JSON.parse(e.data);
  } catch {
    return;
  }

  if (msg.type === "pose" && msg.keypoints?.person_0) {
    lastValidPose = msg.keypoints.person_0;
  }

  if (msg.type === "stats") {
    lastStats = msg;
    statsBox.textContent = JSON.stringify(msg, null, 2);
  }
};

ws.onerror = (e) => console.error("[WS ERROR]", e);
ws.onclose = () => console.warn("[WS CLOSED]");

/* =========================
   CAMERA
========================= */
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      setInterval(sendFrame, 100); // ~10 FPS to backend
      requestAnimationFrame(render);
    };
  })
  .catch(err => {
    statsBox.textContent = "Camera access denied.";
    console.error(err);
  });

/* =========================
   SEND FRAME TO BACKEND
========================= */
function sendFrame() {
  if (ws.readyState !== WebSocket.OPEN) return;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    if (!blob) return;
    blob.arrayBuffer().then(buf => ws.send(buf));
  }, "image/jpeg", 0.6);
}

/* =========================
   RENDER LOOP
========================= */
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (lastValidPose) {
    drawSkeleton(lastValidPose);
    drawPoints(lastValidPose);
  }

  if (lastStats?.input_fps) {
    ctx.fillStyle = "#00ff9c";
    ctx.font = "14px monospace";
    ctx.fillText(`FPS: ${lastStats.input_fps}`, 10, 20);
  }

  if (lastStats?.event) {
    ctx.fillStyle = "#ffaa00";
    ctx.fillText(`EVENT: ${lastStats.event}`, 10, 40);
  }

  requestAnimationFrame(render);
}
</script>

</body>
</html>
