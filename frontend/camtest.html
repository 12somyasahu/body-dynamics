<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Body Dynamics — Debug View</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0d0d0d;
    color: #00ff9c;
    font-family: monospace;
  }

  #stage {
    position: relative;
    width: 640px;
    height: 480px;
    border: 2px solid #00ff9c;
    background: black;
  }

  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 480px;
  }

  #stats {
    margin-top: 10px;
    padding: 10px;
    background: #111;
    border: 1px solid #00ff9c;
    white-space: pre;
    font-size: 13px;
    max-width: 640px;
  }
</style>
</head>

<body>

<h2>Body Dynamics — Engine Debug View</h2>

<div id="stage">
  <video id="video" muted playsinline></video>
  <canvas id="canvas"></canvas>
  <canvas id="captureCanvas" style="display:none;"></canvas>
</div>

<div id="stats">Waiting for data…</div>

<script>
/* =====================================================
   DOM
===================================================== */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const captureCanvas = document.getElementById("captureCanvas");
const captureCtx = captureCanvas.getContext("2d");

const statsBox = document.getElementById("stats");

let lastPose = null;
let lastStats = null;
let videoReady = false;

/* =====================================================
   SKELETON
===================================================== */
const SKELETON = [
  [11,13],[13,15],
  [12,14],[14,16],
  [11,12],
  [11,23],[12,24],
  [23,24],
  [23,25],[25,27],
  [24,26],[26,28]
];

/* =====================================================
   HELPERS
===================================================== */
function isValidPoint(p) {
  return p && typeof p.x === "number" && typeof p.y === "number";
}

/* =====================================================
   DRAWING
===================================================== */
function drawSkeleton(points) {
  ctx.strokeStyle = "#00b3ff";
  ctx.lineWidth = 3;

  SKELETON.forEach(([a,b]) => {
    if (!isValidPoint(points[a]) || !isValidPoint(points[b])) return;
    ctx.beginPath();
    ctx.moveTo(points[a].x * canvas.width, points[a].y * canvas.height);
    ctx.lineTo(points[b].x * canvas.width, points[b].y * canvas.height);
    ctx.stroke();
  });
}

function drawPoints(points) {
  ctx.fillStyle = "#ff003c";
  points.forEach(p => {
    if (!isValidPoint(p)) return;
    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawCOM(com, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(com.x * canvas.width, com.y * canvas.height, 6, 0, Math.PI*2);
  ctx.fill();
}

/* =====================================================
   WEBSOCKET
===================================================== */
const ws = new WebSocket("ws://127.0.0.1:8000/ws/live");

ws.onmessage = e => {
  let msg;
  try { msg = JSON.parse(e.data); }
  catch { return; }

  if (msg.type === "pose") {
    lastPose = msg.keypoints?.person_0 ?? null;
  }

  if (msg.type === "stats") {
    lastStats = msg;
    statsBox.textContent = JSON.stringify(msg, null, 2);
  }
};

/* =====================================================
   CAMERA — HARDENED
===================================================== */
navigator.mediaDevices.getUserMedia({ video: true })
  .then(async stream => {
    video.srcObject = stream;

    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });

    await video.play(); // 🔑 absolutely required

    // Wait until video actually has pixels
    await new Promise(resolve => {
      const check = () => {
        if (video.readyState >= 2) resolve();
        else requestAnimationFrame(check);
      };
      check();
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    captureCanvas.width = video.videoWidth;
    captureCanvas.height = video.videoHeight;

    videoReady = true;

    setInterval(sendFrame, 120);
    requestAnimationFrame(render);
  })
  .catch(err => {
    statsBox.textContent = "Camera error: " + err.message;
  });

/* =====================================================
   SEND FRAME
===================================================== */
function sendFrame() {
  if (!videoReady || ws.readyState !== WebSocket.OPEN) return;

  captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

  captureCanvas.toBlob(blob => {
    if (!blob) return;
    blob.arrayBuffer().then(buf => ws.send(buf));
  }, "image/jpeg", 0.6);
}

/* =====================================================
   RENDER LOOP
===================================================== */
function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (videoReady) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }

  if (lastPose) {
    drawSkeleton(lastPose);
    drawPoints(lastPose);
  }

  if (lastStats?.center_of_mass && lastStats?.stability) {
    let color = "#00ff9c";
    if (lastStats.stability.state === "marginal") color = "#ffaa00";
    if (lastStats.stability.state === "unstable") color = "#ff003c";
    drawCOM(lastStats.center_of_mass, color);
  }

  if (lastStats?.stability?.margin != null) {
    ctx.fillStyle = "#fff";
    ctx.fillText(
      `Stability: ${lastStats.stability.state} | Margin: ${lastStats.stability.margin.toFixed(3)}`,
      10, 20
    );
  }

  requestAnimationFrame(render);
}
</script>

</body>
</html>
