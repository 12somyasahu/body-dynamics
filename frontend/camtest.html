<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Body Dynamics – Live Pose</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0d0d0d;
      color: #00ff9c;
      font-family: monospace;
    }

    #stage {
      position: relative;
      width: 640px;
      height: 480px;
      border: 2px solid #00ff9c;
      background: black;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }

    #stats {
      margin-top: 10px;
      padding: 10px;
      background: #111;
      border: 1px solid #00ff9c;
      white-space: pre;
    }
  </style>
</head>

<body>

<h2>Body Dynamics — Live Pose Test</h2>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="stats">Waiting for WebSocket…</div>

<script>
/* =========================
   DOM & STATE
========================= */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statsBox = document.getElementById("stats");

let latestPose = null;
let lastStats = null;

/* =========================
   SKELETON DEFINITIONS
========================= */
const DRAW_POINTS = new Set([
  0, 11, 12, 13, 14, 15, 16,
  23, 24, 25, 26, 27, 28, 31, 32
]);

const SKELETON = [
  [0, 11], [0, 12],
  [11, 12],
  [11, 23], [12, 24],
  [23, 24],
  [11, 13], [13, 15],
  [12, 14], [14, 16],
  [23, 25], [25, 27], [27, 31],
  [24, 26], [26, 28], [28, 32]
];

/* =========================
   WEBSOCKET
========================= */
const ws = new WebSocket("ws://127.0.0.1:8000/ws/live");
ws.binaryType = "arraybuffer";

ws.onopen = () => {
  statsBox.textContent = "WebSocket connected.\nWaiting for data…";
};

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "pose") {
    latestPose = msg.keypoints;
  }

  if (msg.type === "stats") {
    lastStats = msg;
    statsBox.textContent = JSON.stringify(msg, null, 2);
  }
};

/* =========================
   CAMERA
========================= */
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      setInterval(sendFrame, 100);
      requestAnimationFrame(render);
    };
  });

/* =========================
   SEND FRAME
========================= */
function sendFrame() {
  if (ws.readyState !== WebSocket.OPEN) return;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    if (!blob) return;
    blob.arrayBuffer().then(buf => ws.send(buf));
  }, "image/jpeg", 0.6);
}

/* =========================
   DRAW FUNCTIONS
========================= */
function drawSkeleton(points) {
  ctx.strokeStyle = "#00b3ff";
  ctx.lineWidth = 3;

  SKELETON.forEach(([a, b]) => {
    if (!points[a] || !points[b]) return;

    ctx.beginPath();
    ctx.moveTo(points[a][0] * canvas.width, points[a][1] * canvas.height);
    ctx.lineTo(points[b][0] * canvas.width, points[b][1] * canvas.height);
    ctx.stroke();
  });
}

function drawPoints(points) {
  ctx.fillStyle = "#ff003c";
  points.forEach((p, i) => {
    if (!DRAW_POINTS.has(i)) return;
    ctx.beginPath();
    ctx.arc(p[0] * canvas.width, p[1] * canvas.height, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* =========================
   RENDER LOOP
========================= */
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (latestPose && latestPose.person_0) {
    drawSkeleton(latestPose.person_0);
    drawPoints(latestPose.person_0);
  }

  if (lastStats) {
    ctx.fillStyle = "#00ff9c";
    ctx.font = "16px monospace";
    ctx.fillText(`FPS: ${lastStats.input_fps}`, 10, 20);
  }

  requestAnimationFrame(render);
}
</script>

</body>
</html>
