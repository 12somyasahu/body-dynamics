# Body-Dynamics Configuration
# All tunable parameters in one place

app:
  name: "Body-Dynamics"
  version: "1.0.0"
  environment: "development"  # development, staging, production

# Pose estimation settings
pose:
  model_complexity: 0  # 0=lite (fastest), 1=full, 2=heavy (most accurate)
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  smooth_landmarks: false  # We use Kalman filter instead
  min_visibility: 0.2  # Minimum visibility threshold for keypoints

# Processing settings
processing:
  max_workers: 2  # Thread pool size
  timeout_seconds: 0.2  # Max time per frame before timeout
  stats_interval: 10  # Send stats every N frames

# Frame handling
frame:
  buffer_max_size: 1  # Always keep only latest frame
  send_interval_ms: 100  # Client sends frames every N ms
  
  # Adaptive quality (client-side)
  quality_high: 0.7  # Quality when moving fast
  quality_medium: 0.5  # Quality when moving slowly
  quality_low: 0.3  # Quality when static
  
  motion_threshold_high: 0.03  # COM speed for high quality
  motion_threshold_low: 0.01  # COM speed for low quality

# Biomechanics settings
biomechanics:
  # Ground detection
  ground_epsilon: 0.08  # Distance from lowest point to be "on ground" (pixels)
  foot_contact_duration: 0.05  # Seconds foot must be stable to be grounded
  
  # Center of Mass
  com_trail_length: 30  # Number of points in COM trail
  
  # Stability
  stability:
    margin_epsilon: 0.015  # Distance from BOS edge (pixels)
    unstable_duration: 0.25  # Seconds outside BOS before "unstable"
    hysteresis: 0.01  # Prevents flicker between states
  
  # Support tracking
  support:
    persistence_duration: 0.35  # Keep last BOS for N seconds after loss
  
  # Phase tracking
  phase:
    recovery_duration: 0.4  # Time in "recovery" after instability
  
  # Joint angles (semantic thresholds)
  joints:
    elbow:
      flexion_threshold: 140  # degrees
      extension_threshold: 160  # degrees

# WebSocket settings
websocket:
  max_buffer_bytes: 50000  # Skip frames if buffer exceeds this
  ping_interval: 30  # seconds
  timeout: 60  # seconds

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
# Monitoring
metrics:
  enabled: true
  performance_window: 100  # Track last N frame processing times
  
# Future: Session persistence
session:
  persistence_enabled: false
  database_path: "sessions.db"
  cleanup_after_seconds: 300
